# KCo Docker Compose Configuration
# Old But Gold TR8 IVSTO Infrastructure
# Pre-Seed Target: $30M+ USD

version: '3.8'

services:
  # ==================== API Service ====================
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kco-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Environment
      - ENVIRONMENT=production
      - DEBUG=False
      
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      
      # Database
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=kco_production
      - DB_USER=kco_admin
      - DB_PASSWORD=${DB_PASSWORD:-kco_secure_password}
      
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      
      # LOWDATAESC
      - LOWDATAESC_API_URL=https://api.lowdataesc.com
      - LOWDATAESC_API_KEY=${LOWDATAESC_API_KEY:-}
      
      # Security
      - SECRET_KEY=${SECRET_KEY:-kco-old-but-gold-tr8-ivsto-2024}
      - JWT_SECRET=${JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kco-network
    volumes:
      - ./backend:/app
      - ./ML/models:/app/ML/models
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==================== Database ====================
  postgres:
    image: postgres:15-alpine
    container_name: kco-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=kco_production
      - POSTGRES_USER=kco_admin
      - POSTGRES_PASSWORD=${DB_PASSWORD:-kco_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - kco-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kco_admin -d kco_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Cache ====================
  redis:
    image: redis:7-alpine
    container_name: kco-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - kco-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==================== Message Queue ====================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kco-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=kco_user
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-kco_secure_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - kco-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== ML Worker ====================
  ml-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kco-ml-worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - WORKER_TYPE=ml
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=kco_production
      - DB_USER=kco_admin
      - DB_PASSWORD=${DB_PASSWORD:-kco_secure_password}
    depends_on:
      - postgres
      - redis
    networks:
      - kco-network
    volumes:
      - ./ML:/app/ML
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ==================== Image Processing Service ====================
  image-processor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kco-image-processor
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - SERVICE_TYPE=image_processing
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - kco-network
    volumes:
      - ./ML/models:/app/ML/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ==================== Nginx (Reverse Proxy) ====================
  nginx:
    image: nginx:alpine
    container_name: kco-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - kco-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==================== Monitoring ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: kco-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - kco-network

  grafana:
    image: grafana/grafana:latest
    container_name: kco-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - kco-network
    depends_on:
      - prometheus

  # ==================== Logging ====================
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: kco-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - kco-network

  kibana:
    image: kibana:8.11.0
    container_name: kco-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - kco-network
    depends_on:
      - elasticsearch

networks:
  kco-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
