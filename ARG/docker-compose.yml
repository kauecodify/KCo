# KCo/ARG - Docker Compose

version: '3.8'

services:
  # Backend API
  api:
    build: .
    container_name: kco-arg-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ARG_ENVIRONMENT=development
      - ARG_DEBUG=True
      - ARG_SECRET_KEY=dev-secret-key-change-in-production
      - ARG_POSTGRES_HOST=postgres
      - ARG_POSTGRES_PORT=5432
      - ARG_POSTGRES_USER=postgres
      - ARG_POSTGRES_PASSWORD=postgres
      - ARG_POSTGRES_DB=kco_arg
      - ARG_REDIS_HOST=redis
      - ARG_REDIS_PORT=6379
      - ARG_STORAGE_TYPE=local
      - ARG_STORAGE_PATH=./data/storage
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - kco-arg-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kco-arg-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kco_arg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kco-arg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kco-arg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kco-arg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: kco-arg-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - kco-arg-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: kco-arg-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - kco-arg-network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  kco-arg-network:
    driver: bridge
